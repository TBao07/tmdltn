<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiệp Mời Tốt Nghiệp - Tiểu My</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue-main: #2196F3;
            --blue-light: #E3F2FD;
            --pink-accent: #FF4081;
            --pink-soft: #FCE4EC;
            --white: #FFFFFF;
            --text-dark: #2c3e50;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Quicksand', sans-serif;
            background: url('https://images.unsplash.com/photo-1513151233558-d860c5398176?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 0.8s ease; 
        }

        body.bg-white-active {
            background: #FFFFFF !important;
        }

        #input-page {
            z-index: 10;
            text-align: center;
            transition: all 0.8s ease;
            position: fixed;
            top: 0; left: 0; 
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('img/chuymy.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
        }

        .input-group {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* --- CẬP NHẬT: CANH LỀ TRÊN 20PX SO VỚI MÀN HÌNH --- */
        .title-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 320px;
            box-sizing: border-box;

            background: var(--white);
            color: #000000;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        } 

        .title-box h2 { 
            color: #000000; 
            font-family: 'Dancing Script', cursive; 
            font-size: 1.7rem; 
            margin: 0;
        }

        /* --- CẬP NHẬT: CANH LỀ DƯỚI BUTTON 25PX VÀ Ô NHẬP TÊN CÁCH BUTTON 10PX --- */
        .action-box {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .action-box input[type="text"] {
            margin: 0 0 10px 0; /* Cách lề dưới (nút button) đúng 10px */
            padding: 15px;
            border-radius: 15px;
            border: 2px solid var(--blue-light);
            width: 85%;
            max-width: 280px;
            font-size: 1rem;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            text-align: center;
        }

        .btn-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            font-size: 1.2rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        button {
            padding: 12px 35px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(45deg, var(--blue-main), var(--pink-accent));
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
            transition: transform 0.3s;
        }

        button:hover { transform: scale(1.05); }

        /* TRANG 2: THIỆP MỜI */
        #invitation-page {
            background: var(--white);
            display: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .card {
            width: 380px;
            background: var(--white);
            padding: 30px;
            border-radius: 40px;
            border: 10px double var(--blue-light);
            position: relative;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            animation: fadeInCard 1.2s ease-out;
        }

        @keyframes fadeInCard {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .title-main { font-size: 2.2rem; color: var(--blue-main); margin: 0; font-weight: 600; letter-spacing: 2px; }
        .sub-title { color: var(--pink-accent); font-size: 1.3rem; margin: 5px 0; }
        .event-name { font-family: 'Dancing Script', cursive; font-size: 3.8rem; color: var(--blue-main); margin: -5px 0; text-shadow: 2px 2px var(--blue-light); }
        .invite-text { font-size: 1rem; color: var(--text-dark); margin-top: 25px; font-weight: 600; }
        
        #display-name {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: var(--pink-accent);
            display: inline-block;
            margin: 10px 0 25px 0;
            position: relative;
        }

        #display-name::after {
            content: ''; position: absolute; bottom: 5px; left: 0; width: 100%; height: 2px; background: var(--pink-soft);
        }

        .info-box { background: var(--blue-light); border-radius: 20px; padding: 15px; margin: 10px auto; width: 90%; }
        .info-item { display: flex; align-items: center; gap: 15px; margin: 10px 0; }
        .icon-circle { width: 40px; height: 40px; background: var(--white); color: var(--blue-main); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .time-detail b { color: var(--blue-main); font-size: 0.8rem; display: block; text-align: left;}
        .time-detail span { color: var(--text-dark); font-size: 1.4rem; font-weight: bold; }
        .footer-note { font-family: 'Dancing Script', cursive; font-size: 1.8rem; color: var(--blue-main); margin-top: 25px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="input-page">
        <div class="input-group">
            
            <div class="title-box">
                <h2>Thân mời bạn đến chung vui ngày tốt nghiệp cùng Tiểu My!</h2>
            </div>
            
            <div class="action-box">
                <input type="text" id="nameInput" placeholder="Nhập tên của bạn...">
                <div class="btn-wrap">
                    👉 <button onclick="showInvitation()">Mở thiệp ngay</button> 👈
                </div>
            </div>

        </div>
    </div>

    <div id="invitation-page">
        <div class="card">
            <div class="title-main">THIỆP MỜI</div>
            <div class="sub-title">♥ DỰ LỄ ♥</div>
            <div class="event-name">Tốt nghiệp</div>
            <div class="invite-text">Trân trọng và long trọng kính mời</div>
            <div id="display-name">Khách mời</div>
            <div class="info-box">
                <div class="info-item">
                    <div class="icon-circle">📅</div>
                    <div class="time-detail">
                        <b>NGÀY DIỄN RA</b>
                        <span>30/5/2026</span>
                    </div>
                </div>
                <div style="border-top: 1px dashed var(--white); margin: 5px 0;"></div>
                <div class="info-item">
                    <div class="icon-circle">⏰</div>
                    <div class="time-detail">
                        <b>THỜI GIAN</b>
                        <span>10:00 GIỜ</span>
                    </div>
                </div>
            </div>
            <div class="footer-note">
                Nhớ đến dự cùng Tiểu My nhóooo 😘
            </div>
        </div>
    </div>
    
    <script>
        function showInvitation() {
            const name = document.getElementById('nameInput').value;
            if (name.trim() === "") {
                alert("Aiu ơi, phải nhập tên thì thiệp mới hiện được nè!");
                return;
            }
            document.getElementById('display-name').innerText = name;
            
            const inputPage = document.getElementById('input-page');
            const inviPage = document.getElementById('invitation-page');
            
            document.body.classList.add('bg-white-active');
            inputPage.style.transform = "scale(0.8)";
            inputPage.style.opacity = '0';
            
            setTimeout(() => {
                inputPage.classList.add('hidden');
                inviPage.style.display = 'block';
                setTimeout(() => {
                    inviPage.style.opacity = '1';
                }, 100);
            }, 600);
        }
    </script>
</body>
</html>
